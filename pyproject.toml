[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "5d-nd"
dynamic = ["version"]
description = "Reference resolver for the 5d+nd grounding scheme — one interchangeable option among a governance certification's grounding schemes (peers: 7d+nd, prov-o), not a standard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flxk1" }]
keywords = ["grounding", "provenance", "dimensions", "governance-certification", "versum"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
]
# No hard dependencies: the resolver seam is stdlib-only.
dependencies = []

[project.optional-dependencies]
# The dimension vocabulary + composition table is VENDORED into
# src/five_d_nd/dimensions.py, but the AUTHORITATIVE table lives upstream in
# loomground-solver. Install this extra to depend on the real module instead of
# the vendored copy (keep the two in sync until the resolver imports upstream).
solver = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
]
# resolve() is the one function with a runtime dependency on versum (imported
# lazily, only inside resolve() — importing this package stays stdlib-only
# otherwise). Install this extra to actually call resolve() against a real
# versum store.
#
# HONESTY NOTE (2026-09-27): resolve() needs versum.coordinates.entry_coordinates,
# which is NOT present in any tagged loomground-versum release yet — the newest
# tag, loomground-versum-v0.14.0, predates the commit that adds it
# ("feat(coordinates): entry_coordinates + entries_in_cell query API and CLI").
# Pinning that tag here would be a broken pin (versum.coordinates would not
# import). Left UNPINNED on purpose until a release ships `coordinates`; for
# local development in the meantime, install the sibling repo by path or
# branch instead of relying on this extra, e.g.:
#     pip install -e ../loomground-versum
# or
#     pip install "loomground-versum @ git+https://github.com/flxk1/loomground-versum@<branch-or-commit-with-coordinates>"
# Once a release contains `coordinates`, re-pin this extra to that version
# (e.g. "loomground-versum>=0.15.0") and remove this note.
grounding = [
    "loomground-versum",
]
dev = ["pytest>=7"]

[tool.setuptools]
license-files = ["LICENSES/*.txt", "NOTICE"]

[tool.setuptools.dynamic]
version = { attr = "five_d_nd._version.__version__" }

# Distribution name is "5d-nd" (starts with a digit — valid for a project name
# but not for a Python identifier), so the import package is "five_d_nd".
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
