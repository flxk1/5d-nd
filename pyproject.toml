[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "5d-nd"
dynamic = ["version"]
description = "Reference resolver for the 5d+nd grounding scheme — one interchangeable option among a governance certification's grounding schemes (peers: 7d+nd, prov-o), not a standard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flxk1" }]
keywords = ["grounding", "provenance", "dimensions", "governance-certification", "versum"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
]
# No hard dependencies: the resolver seam is stdlib-only.
dependencies = []

[project.optional-dependencies]
# The dimension vocabulary + composition table is VENDORED into
# src/five_d_nd/dimensions.py, but the AUTHORITATIVE table lives upstream in
# loomground-solver. Install this extra to depend on the real module instead of
# the vendored copy (keep the two in sync until the resolver imports upstream).
solver = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@4c01e0390767917333db99b6355842eb34745563",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@3eed4cab3cba2a288fcac3671171cd4fa7e5bc18",
]
# resolve() is the one function with a runtime dependency on versum (imported
# lazily, only inside resolve() — importing this package stays stdlib-only
# otherwise). Install this extra to actually call resolve() against a real
# versum store.
#
# The extra pins versum at a main commit that has versum.coordinates.entry_coordinates
# (no tagged versum release carries it yet), plus the factual plane, which contributes
# the action-type entries the resolver reads (planes are separate installs, discovered
# by entry point).
grounding = [
    "loomground-versum @ git+https://github.com/flxk1/loomground-versum@2e608826834a580646abcaf5991fffb6b19e03d6",
    "loomground-factual @ git+https://github.com/flxk1/loomground-factual@4f3043dcd64f1cde4e30f790a76afe80058ab4dc",
]
dev = ["pytest>=7"]

[tool.setuptools]
license-files = ["LICENSES/*.txt", "NOTICE"]

[tool.setuptools.dynamic]
version = { attr = "five_d_nd._version.__version__" }

# Distribution name is "5d-nd" (starts with a digit — valid for a project name
# but not for a Python identifier), so the import package is "five_d_nd".
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
