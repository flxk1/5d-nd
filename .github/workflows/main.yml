name: main
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  grounding:
    # The resolver's versum-backed tests skip without the grounding extra; this
    # job installs it so they run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Editable versum at the grounding extra's pinned commit: the tests read
      # versum's committed fixtures through its source tree.
      - uses: actions/checkout@v4
        with:
          repository: flxk1/loomground-versum
          ref: 2e608826834a580646abcaf5991fffb6b19e03d6
          path: _siblings/loomground-versum
      - run: python -m pip install -e _siblings/loomground-versum
      - run: python -m pip install "loomground-factual @ git+https://github.com/flxk1/loomground-factual@4f3043dcd64f1cde4e30f790a76afe80058ab4dc"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
